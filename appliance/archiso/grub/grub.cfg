# ==============================================================================
# vHackintosh Appliance - GRUB 2 Configuration
# ==============================================================================

# Load partition table and file system modules
insmod part_gpt
insmod part_msdos
insmod fat
insmod iso9660
insmod font
insmod gfxterm
insmod png
insmod all_video

set gfxmode=1920x1080,1280x720,auto
terminal_output gfxterm

# Load font
if [ -f "${prefix}/fonts/unicode.pf2" ]; then
    loadfont "${prefix}/fonts/unicode.pf2"
fi

# Load vHackintosh Dark Apple Aesthetic Theme
if [ -f "${prefix}/themes/vhackintosh/theme.txt" ]; then
    set theme="${prefix}/themes/vhackintosh/theme.txt"
fi

set default="vhackintosh"
set timeout=5
set timeout_style=menu

menuentry "vHackintosh OS Appliance (Live Kiosk - Vulkan & KVM)" --class osx --class gnu-linux --id 'vhackintosh' {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% cow_spacesize=10G nvidia-drm.modeset=1 i915.enable_guc=3 quiet splash
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
}

menuentry "vHackintosh OS (Modo Diagnóstico & Verbose)" --class recovery --class gnu-linux --id 'vhackintosh-verbose' {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% cow_spacesize=10G nvidia-drm.modeset=1 i915.enable_guc=3 systemd.log_level=debug
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
}

# Entrada para TESTAR a ISO numa VM emulada. Sem `vhack_skip_vulkan=1` o gate
# de Vulkan do appliance desliga a máquina, porque QEMU/llvmpipe não tem GPU
# física com Vulkan 1.2+ — o que é correto no hardware real e inútil para
# testar. Ter a entrada pronta evita a única alternativa que existia antes:
# editar a linha do GRUB a cada boot (ou trocar o SSD do notebook).
#
# O parâmetro só PULA a checagem; não é um "modo de compatibilidade" e a tela
# de bloqueio deixa claro que nenhuma GPU foi validada.
menuentry "vHackintosh OS (Testar em VM - sem verificação de Vulkan)" --class recovery --class gnu-linux --id 'vhackintosh-vm-test' {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% cow_spacesize=10G nvidia-drm.modeset=1 i915.enable_guc=3 quiet splash vhack_skip_vulkan=1
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
}

if [ "${grub_platform}" == 'efi' ]; then
    menuentry "Configurações de Firmware UEFI (BIOS Setup)" --class efi --id 'uefi-firmware' {
        fwsetup
    }
fi

menuentry "Reiniciar Computador" --class restart --class reboot {
    echo "Reiniciando..."
    reboot
}

menuentry "Desligar Computador" --class shutdown --class halt {
    echo "Desligando..."
    halt
}
