# /etc/vhackintosh/sway.conf
#
# Sessão Wayland mínima do vHackintosh Appliance (substitui a antiga sessão
# X11/Openbox). Objetivo: uma única janela — a janela do reims-vgpu com o
# macOS — ocupando o monitor inteiro, sem barra, sem bordas e sem gaps.
#
# Por que isto funciona em qualquer resolução de monitor:
#   o sway entrega ao cliente o output inteiro (uma janela só, tile = tela) e o
#   reims-vgpu encaixa o framebuffer do guest por *aspect-fit* (letterbox),
#   nunca recortando. Logo 1080p, 1440p ou 4K exibem o desktop inteiro.
#
# Validar alterações sem abrir sessão gráfica:
#   sway -C -c /etc/vhackintosh/sway.conf

# --- Sessão ------------------------------------------------------------------
# XWayland desabilitado por decisão de projeto: nenhum cliente X11 roda neste
# appliance. O sway só o habilitaria se o binário existisse, e nós não
# instalamos `xorg-server-xwayland`. Declarar aqui torna a intenção explícita e
# evita o aviso de "XWayland indisponível" no log.
xwayland disable

# --- Entrada -----------------------------------------------------------------
# O toque-para-clicar (tapping) NÃO é configurável por quirk do libinput: a
# tabela de atributos de quirks não tem campo de tapping. Ele só existe via
# compositor, e é por isso que a sessão é sway e não cage (o cage não lê arquivo
# de configuração algum e portanto não tem como habilitar tapping).
input "type:touchpad" {
    tap enabled
    natural_scroll enabled
    accel_profile adaptive
    dwt enabled
}

# Teclado com layout US, igual ao que a janela do macOS espera.
input "type:keyboard" {
    xkb_layout us
    repeat_delay 250
    repeat_rate 35
}

# --- Saída -------------------------------------------------------------------
# scale 1 mantém o mapeamento 1:1 entre pixels do output e pixels do guest, que
# é o que o aspect-fit do reims-vgpu pressupõe. adaptive_sync off evita que o
# VRR do monitor altere o ritmo de apresentação do guest.
#
# `bg` faz o sway executar o binário `swaybg` (comando customizável por
# `swaybg_command`; o default embutido é `swaybg`, executado mesmo sem `bg`).
# Atenção: `swaybg` NÃO é dependência do sway — está declarado explicitamente em
# packages.x86_64. Sem o pacote, o sway registra "failed to execute 'swaybg'".
output * {
    bg #000000 solid_color
    scale 1
    adaptive_sync off
}

# --- Janela ------------------------------------------------------------------
# Sem barra de status: nenhum bloco `bar` é declarado, então o sway não inicia
# o swaybar. A única janela (a VM) preenche o workspace inteiro.
default_border none
default_floating_border none
gaps inner 0
gaps outer 0
smart_gaps off

# Impede que a janela da VM seja movida/redimensionada por acidente e garante
# foco exclusivo para o guest (equivale ao papel do Openbox na sessão antiga).
focus_follows_mouse no
mouse_warping none

# --- Cliente primário --------------------------------------------------------
# vhackintosh-waysession gera este script em tempo de execução com o comando
# exato da VM; ele roda o QEMU e encerra o sway quando a VM termina, devolvendo
# o console à TUI.
exec /run/vhackintosh/sway-app.sh
