# vHackintosh — virtualização aninhada (change appliance-i18n…, grupo 6/D6)
#
# Com nested=1 a VM enxerga VT-x/AMD-V (sysctl machdep.cpu.features → VMX),
# habilitando Docker/UTM dentro do macOS. Colocado ANTES do parâmetro default
# do módulo, que a maioria das distros traz como nested=0 em outra linha —
# a última opção vence, e esta é a última.
options kvm_intel nested=1
options kvm_amd nested=1
