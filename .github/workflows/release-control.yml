name: Release vHackintosh Control

on:
  pull_request:
    paths:
      - ".github/workflows/release-control.yml"
      - "web/**"
      - "core/**"
      - "appliance/archiso/airootfs/etc/systemd/system/vhackintosh-*.service"
      - "appliance/archiso/airootfs/etc/vhackintosh/sway.conf"
      - "appliance/archiso/airootfs/usr/local/bin/vhackintosh-web-bootstrap"
      - "appliance/archiso/airootfs/usr/local/bin/vhackintosh-waysession"
      - "appliance/archiso/airootfs/usr/local/bin/vhackintosh-wait-wayland"
      - "packaging/**"
      - "resources/macserial/**"
      - "resources/reims-kexts/**"
      - "tests/test_control_package_payload.py"
      - "tests/test_reims_util_pin.py"
      - "tests/test_web_api.py"
      - "tests/test_web_appliance_packaging.py"
  push:
    tags:
      - "control-v*"

permissions:
  contents: write

jobs:
  linux-packages:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build Debian, RPM, and Arch packages
        env:
          VHACK_CONTAINER_ENGINE: docker
        run: |
          if [[ "$GITHUB_REF" == refs/tags/control-v* ]]; then
            version="${GITHUB_REF_NAME#control-v}"
          else
            version="0.0.${GITHUB_RUN_NUMBER}"
          fi
          packaging/build-all.sh "$version" dist
      - name: Validate package metadata
        run: dpkg-deb --info dist/vhackintosh-control_*_amd64.deb
      - name: Install package and check first-run services
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        run: |
          sudo apt-get update
          sudo apt-get install -y ./dist/vhackintosh-control_*_amd64.deb
          test -f /usr/lib/systemd/system/vhackintosh-vm@.service
          grep -q '^Environment=VHACKINTOSH_VM_DISPLAY_MODE=desktop$' /usr/lib/systemd/system/vhackintosh-vm@.service
          ! grep -q '^Requires=vhackintosh-display.service$' /usr/lib/systemd/system/vhackintosh-vm@.service
          test -x /opt/vhackintosh/resources/macserial/macserial
          /opt/vhackintosh/resources/macserial/macserial -v 2>&1 | grep -q '2.1.8'
          test -s /opt/vhackintosh/web/current/templates/OVMF_VARS.fd
          test -s /opt/vhackintosh/web/current/templates/OVMF_CODE_4M.fd
          kext_root="$(readlink -f /opt/vhackintosh/web/current)/resources/reims-kexts"
          for kext in ReimsVgpu.kext AppleGraphicsDeviceControlBridge.kext \
            AppleParavirtGPULoader.kext AppleParavirtIOSurface.kext IOGPUFamilyBridge.kext \
            AppleParavirtGPUIOGPUFamily.kext IOGraphicsFamilyBridge.kext APVDisplayPort.kext; do
            test -s "$kext_root/$kext/Contents/Info.plist"
          done
          test "$(find "$kext_root" -mindepth 1 -maxdepth 1 -type d -name '*.kext' | wc -l)" -eq 8
          # A tabela de kexts tem de estar utilizável no runtime INSTALADO. Um
          # `grep` textual em core/reims_util.py passou a mentir quando a frente B
          # moveu a resolução de kexts para core/graphics_profiles.py (o grep virou
          # 0 matches com o payload saudável). Importar o módulo prova o contrato
          # real: o bundle leva kexts vendorizados e o caminho resolve para dentro
          # do PRÓPRIO bundle (não para um diretório ausente).
          bundle_root="$(readlink -f /opt/vhackintosh/web/current)"
          python3 -c 'import os,sys; b=os.path.realpath(sys.argv[1]); sys.path.insert(0,b); import core.graphics_profiles as g; assert g.VENDORED_KEXTS, "tabela de kexts vendorizados vazia"; r=os.path.realpath(str(g.VENDORED_KEXTS_DIR)); assert r.startswith(b+os.sep), f"VENDORED_KEXTS_DIR fora do bundle: {r} (bundle {b})"; m=[n for n,_ in g.VENDORED_KEXTS if not (g.VENDORED_KEXTS_DIR/n).is_dir()]; assert not m, f"kexts vendorizados ausentes no bundle: {m}"' "$bundle_root"
          test -x /opt/vhackintosh/resources/reims-util/reims-util
          /opt/vhackintosh/resources/reims-util/reims-util --version | grep -q '^reims-util '
          /opt/vhackintosh/resources/reims-util/reims-util opencore --help | grep -q -- '--add-kext'
          pinned_rev="$(sed -n 's/^REV=//p' packaging/reims-util.pin | head -n1)"
          test -n "$pinned_rev"
          grep -q "Commit: ${pinned_rev}" /opt/vhackintosh/resources/reims-util/PROVENANCE.txt
          sudo systemctl is-active vhackintosh-agent.service
          sudo systemctl is-active vhackintosh-web.service
          sudo systemctl is-active vhackintosh-http-redirect.service
          redirect_code=$(curl --silent --show-error -o /dev/null -D /tmp/vh-redirect-headers -w '%{http_code}' 'http://127.0.0.1/control-test?from=http')
          test "$redirect_code" = 308
          grep -qi '^Location: https://127.0.0.1:8443/control-test?from=http' /tmp/vh-redirect-headers
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --insecure https://127.0.0.1:8443/api/v1/session -o /tmp/vh-session.json; then break; fi
            sleep 1
          done
          python3 -c 'import json; s=json.load(open("/tmp/vh-session.json")); assert s["bootstrap_required"] is False and s["default_credentials_available"] is True'
          curl --fail --silent --show-error --insecure -c /tmp/vh-cookies.txt \
            -H 'Origin: https://127.0.0.1:8443' -H 'Content-Type: application/json' \
            -d '{"username":"admin","password":"vhackintosh"}' \
            https://127.0.0.1:8443/api/v1/session/login -o /tmp/vh-login.json
          python3 -c 'import json; assert json.load(open("/tmp/vh-login.json"))["must_change_password"] is True'
          code=$(curl --silent --insecure -b /tmp/vh-cookies.txt -o /tmp/vh-blocked.json -w '%{http_code}' https://127.0.0.1:8443/api/v1/host)
          test "$code" = 403
          python3 -c 'import json; assert json.load(open("/tmp/vh-blocked.json"))["code"] == "password_change_required"'
      - name: Verify self-update from the protected agent environment
        run: |
          agent_before=$(systemctl show vhackintosh-agent.service -p InvocationID --value)
          printf 'stale-before-self-update\n' | sudo tee /usr/lib/vhackintosh/control-version >/dev/null
          package=$(realpath dist/vhackintosh-control_*_amd64.deb)
          sudo systemd-run --wait --pipe --collect --service-type=exec \
            --property=ProtectSystem=full \
            --property=NoNewPrivileges=yes \
            --property=WorkingDirectory=/opt/vhackintosh/web/current \
            --setenv=PYTHONPATH=/opt/vhackintosh/web/current:/opt/vhackintosh/web/current/vendor \
            /usr/bin/python3 "$PWD/tests/control_update_systemd_smoke.py" "$package"
          for attempt in $(seq 1 30); do
            agent_after=$(systemctl show vhackintosh-agent.service -p InvocationID --value)
            if [[ -n "$agent_after" && "$agent_before" != "$agent_after" ]] && \
                systemctl is-active --quiet vhackintosh-agent.service vhackintosh-web.service && \
                curl --fail --silent --show-error --insecure https://127.0.0.1:8443/api/v1/session >/dev/null; then
              break
            fi
            sleep 1
          done
          test -n "$agent_after"
          test "$agent_before" != "$agent_after"
          systemctl is-active --quiet vhackintosh-agent.service vhackintosh-web.service
          test "$(cat /usr/lib/vhackintosh/control-version)" = "$(dpkg-query -W -f='${Version}' vhackintosh-control)"
          test "$(basename "$(readlink -f /opt/vhackintosh/web/current)")" = "$(cat /usr/lib/vhackintosh/control-bundle-id)"
      - name: Verify Arch upgrade from legacy directory install
        run: |
          mkdir -p /tmp/vh-arch-upgrade/old
          curl --fail --silent --show-error --location \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/control-v1.0.0-beta.11/vhackintosh-control-1.0.0.beta.11-1-x86_64.pkg.tar.zst" \
            -o /tmp/vh-arch-upgrade/old/vhackintosh-control-1.0.0.beta.11-1-x86_64.pkg.tar.zst
          docker run --rm \
            --volume "$PWD/dist:/new:ro" \
            --volume /tmp/vh-arch-upgrade/old:/old:ro \
            archlinux:base bash -euc '
              pacman -Sy --noconfirm >/dev/null
              pacman -U --noconfirm --nodeps /old/*.pkg.tar.zst >/dev/null
              mkdir -p /opt/vhackintosh/web/current
              echo legacy > /opt/vhackintosh/web/current/unmanaged-file
              pacman -U --noconfirm --nodeps /new/*.pkg.tar.zst
              test -L /opt/vhackintosh/web/current
              target="$(readlink -f /opt/vhackintosh/web/current)"
              test -s "$target/templates/OVMF_CODE_4M.fd"
              find /opt/vhackintosh/web/bundles -path "*/unmanaged-file" -exec grep -qx legacy {} \;
            '
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/control-v')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          args=("$GITHUB_REF_NAME" dist/vhackintosh-control_*_amd64.deb \
            dist/vhackintosh-control-*.rpm dist/vhackintosh-control-*.pkg.tar.zst dist/SHA256SUMS \
            --title "vHackintosh Control ${GITHUB_REF_NAME#control-v}" --generate-notes)
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then args+=(--prerelease); fi
          gh release create "${args[@]}"
